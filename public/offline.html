<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus-Atlas — keine Verbindung</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0b0d10;
        color: #e8e6e1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 320px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 8px;
        color: #d9695f;
      }
      p {
        font-size: 13px;
        line-height: 1.5;
        color: #8b9198;
        margin: 0;
      }
      button {
        margin-top: 20px;
        padding: 8px 18px;
        font-size: 13px;
        border-radius: 999px;
        border: 1px solid rgba(201, 154, 91, 0.35);
        background: #1a1e23;
        color: #e8e6e1;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Keine Verbindung – Marktdaten nicht aktuell.</h1>
      <p>Nexus-Atlas benötigt eine Internetverbindung für Live-Marktdaten. Bitte Verbindung prüfen und erneut versuchen.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
